name: publish
# Releases are published by the `publish-mcp` workflow in omnia-v/omnia-tracing,
# where the @omnia-voice npm token lives (one token, one place). This workflow
# is the same job for when this repo gets its own NPM_TOKEN secret — run it
# by hand; it is not wired to tags so a tag push never fails on a missing secret.
on:
  workflow_dispatch:
jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
